<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>멤버 목록 | EnjoyTrip</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
<script src="js/common/theme-init.js"></script>
<script src="js/config.js"></script>
<script type="module" src="js/pages/members.js"></script>
</head>
<body data-page="members">
    <div id="site-header"></div>
    <main id="main">
        <div class="page-head">
            <p class="eyebrow">MEMBERS</p>
            <h1>멤버 목록</h1>
            <p>총 <strong id="total">0</strong>명의 회원이 있습니다.</p>
        </div>
        <form class="list-search" id="search-form">
            <select id="key" aria-label="검색항목">
                <option value="">검색항목 선택</option>
                <option value="name">이름</option>
                <option value="email">이메일</option>
            </select>
            <input type="text" id="word" placeholder="검색어를 입력하세요" />
            <button type="submit" class="search-button">검색</button>
        </form>
        <div class="data-table-wrap">
            <table class="data-table">
                <thead>
                    <tr><th>no</th><th>이름</th><th>이메일</th><th>권한</th></tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
        <nav aria-label="페이지 이동"><ul id="pager" class="pager"></ul></nav>
    </main>
    <div id="site-footer"></div>
</body>
</html>
