<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 찾기 | EnjoyTrip</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
<script src="js/common/theme-init.js"></script>
<script src="js/config.js"></script>
<script type="module" src="js/pages/password-reset.js"></script>
</head>
<body data-page="password-reset">
    <div id="site-header"></div>
    <main id="main">
        <section class="auth-card member-modal">
            <header class="member-modal-header">
                <div>
                    <p class="eyebrow">RESET PASSWORD</p>
                    <h2>비밀번호 찾기</h2>
                </div>
            </header>
            <form id="reset-form" class="member-form">
                <p class="member-form-description">가입한 이메일과 이름을 확인한 뒤 새 비밀번호를 설정합니다.</p>
                <div class="member-field">
                    <label for="email">이메일</label>
                    <input type="email" id="email" autocomplete="username" required />
                </div>
                <div class="member-field">
                    <label for="name">이름</label>
                    <input type="text" id="name" autocomplete="name" required />
                </div>
                <div class="member-field">
                    <label for="password">새 비밀번호</label>
                    <input type="password" id="password" minlength="8" maxlength="64" autocomplete="new-password" required />
                    <small>8자 이상 입력해 주세요.</small>
                </div>
                <div class="member-field">
                    <label for="password-confirm">새 비밀번호 확인</label>
                    <input type="password" id="password-confirm" minlength="8" maxlength="64" autocomplete="new-password" required />
                </div>
                <p id="form-message" class="alert-msg" role="alert"></p>
                <div class="member-actions">
                    <a class="btn-link member-secondary" href="login.html">취소</a>
                    <button id="submit" type="submit" class="member-primary">새 비밀번호 저장</button>
                </div>
            </form>
        </section>
    </main>
    <div id="site-footer"></div>
</body>
</html>
