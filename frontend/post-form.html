<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글쓰기 | EnjoyTrip</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
<script src="js/common/theme-init.js"></script>
<script src="js/config.js"></script>
<script type="module" src="js/pages/post-form.js"></script>
</head>
<body data-page="board">
    <div id="site-header"></div>
    <main id="main">
        <section class="auth-card wide member-modal">
            <header class="member-modal-header">
                <div>
                    <p class="eyebrow">COMMUNITY</p>
                    <h2 id="form-title">글쓰기</h2>
                </div>
            </header>
            <form id="post-form" class="member-form" hidden>
                <p class="member-form-description">작성자는 로그인한 회원 이름(<span id="writer-name"></span>)으로 표시됩니다.</p>
                <div class="member-field">
                    <label for="title">제목</label>
                    <input type="text" id="title" maxlength="80" required placeholder="제목을 입력하세요" />
                </div>
                <div class="member-field">
                    <label for="content">내용</label>
                    <textarea id="content" rows="12" maxlength="2000" required placeholder="내용을 입력하세요"></textarea>
                    <small><span id="content-count">0</span>/2000자</small>
                </div>
                <p id="form-message" class="alert-msg" role="alert"></p>
                <div class="member-actions">
                    <a id="cancel" class="btn-link member-secondary" href="board.html">취소</a>
                    <button id="submit" type="submit" class="member-primary">등록</button>
                </div>
            </form>
        </section>
    </main>
    <div id="site-footer"></div>
</body>
</html>
