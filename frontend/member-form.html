<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원정보 수정 | EnjoyTrip</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
<script src="js/common/theme-init.js"></script>
<script src="js/config.js"></script>
<script type="module" src="js/pages/member-form.js"></script>
</head>
<body data-page="member">
    <div id="site-header"></div>
    <main id="main">
        <section class="auth-card member-modal">
            <header class="member-modal-header">
                <div>
                    <p class="eyebrow">MEMBER</p>
                    <h2>회원정보 수정</h2>
                </div>
            </header>
            <form id="member-form" class="member-form" hidden>
                <div class="member-field">
                    <label for="name">이름</label>
                    <input type="text" id="name" maxlength="50" required />
                </div>
                <div class="member-field">
                    <label for="email">이메일</label>
                    <input type="email" id="email" readonly />
                </div>
                <p class="member-form-description">비밀번호·이메일은 회원 정보 화면의 "비밀번호·이메일 변경"(Keycloak 계정 관리)에서 바꿉니다.</p>
                <div id="role-field" class="member-field" hidden>
                    <label for="role">권한 (관리자만 변경)</label>
                    <select id="role">
                        <option value="USER">USER</option>
                        <option value="ADMIN">ADMIN</option>
                    </select>
                </div>
                <p id="form-message" class="alert-msg" role="alert"></p>
                <div class="member-actions">
                    <a id="cancel" class="btn-link member-secondary" href="member.html">취소</a>
                    <button id="submit" type="submit" class="member-primary">수정</button>
                </div>
            </form>
        </section>
    </main>
    <div id="site-footer"></div>
</body>
</html>
