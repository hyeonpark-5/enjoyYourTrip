<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원 정보 | EnjoyTrip</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
<script src="js/common/theme-init.js"></script>
<script src="js/config.js"></script>
<script type="module" src="js/pages/member.js"></script>
</head>
<body data-page="member">
    <div id="site-header"></div>
    <main id="main">
        <section class="auth-card member-modal">
            <header class="member-modal-header">
                <div>
                    <p class="eyebrow">MEMBER</p>
                    <h2>회원 정보</h2>
                </div>
            </header>
            <div id="member-profile" class="member-profile" hidden>
                <div id="member-avatar" class="member-avatar" aria-hidden="true"></div>
                <div>
                    <strong id="member-name"></strong>
                    <span id="member-email-head"></span>
                </div>
                <dl>
                    <div><dt>회원번호</dt><dd id="member-id"></dd></div>
                    <div><dt>이메일</dt><dd id="member-email"></dd></div>
                    <div><dt>권한</dt><dd id="member-role"></dd></div>
                    <div><dt>가입일</dt><dd id="member-created"></dd></div>
                </dl>
                <div class="member-actions">
                    <a id="member-modify" class="btn-link member-primary" href="#">수정</a>
                    <button id="member-delete" type="button" class="member-danger">탈퇴</button>
                </div>
            </div>
            <p id="form-message" class="alert-msg" role="alert"></p>
        </section>
    </main>
    <div id="site-footer"></div>
</body>
</html>
