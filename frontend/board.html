<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>커뮤니티 | EnjoyTrip</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
<script src="js/common/theme-init.js"></script>
<script src="js/config.js"></script>
<script type="module" src="js/pages/board.js"></script>
</head>
<body data-page="board">
    <div id="site-header"></div>
    <main id="main">
        <div class="page-head">
            <p class="eyebrow">COMMUNITY</p>
            <h1>여행자 커뮤니티</h1>
            <p>공지사항을 확인하고 여행 정보와 경험을 자유롭게 공유해 보세요.</p>
        </div>
        <div class="community-tabs" role="tablist" aria-label="커뮤니티 게시판 선택">
            <a id="tab-NOTICE" class="community-tab" role="tab" href="board.html?type=NOTICE">공지사항</a>
            <a id="tab-POST" class="community-tab" role="tab" href="board.html?type=POST">공유게시판</a>
        </div>
        <form class="list-search" id="search-form">
            <select id="key" aria-label="검색항목">
                <option value="">검색항목 선택</option>
                <option value="title">제목</option>
                <option value="content">내용</option>
                <option value="author">작성자</option>
            </select>
            <input type="text" id="word" placeholder="검색어를 입력하세요" />
            <button type="submit" class="search-button">검색</button>
        </form>
        <div class="board-toolbar">
            <span id="total" class="filter-chip">총 0건</span>
            <a id="write" class="btn-link member-primary" href="#" hidden>글쓰기</a>
        </div>
        <div class="data-table-wrap">
            <table class="data-table board-table">
                <thead>
                    <tr>
                        <th class="col-no">no</th>
                        <th>제목</th>
                        <th class="col-author">작성자</th>
                        <th class="col-date">작성일</th>
                        <th class="col-views">조회</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
        <nav aria-label="페이지 이동"><ul id="pager" class="pager"></ul></nav>
    </main>
    <div id="site-footer"></div>
</body>
</html>
