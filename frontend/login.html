<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 | EnjoyTrip</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
<script src="js/common/theme-init.js"></script>
<script src="js/config.js"></script>
<script type="module" src="js/pages/login.js"></script>
</head>
<body data-page="login">
    <div id="site-header"></div>
    <main id="main">
        <section class="auth-card member-modal">
            <header class="member-modal-header">
                <div>
                    <p class="eyebrow">WELCOME BACK</p>
                    <h2>로그인</h2>
                </div>
            </header>
            <form id="login-form" class="member-form">
                <p class="member-form-description">가입한 이메일과 비밀번호를 입력해 주세요.</p>
                <div class="member-field">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" placeholder="email 입력" autocomplete="username" required />
                </div>
                <div class="member-field">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required />
                </div>
                <a class="member-text-button" href="password-reset.html">비밀번호 찾기</a>
                <p id="form-message" class="alert-msg" role="alert"></p>
                <div class="member-actions">
                    <a class="btn-link member-secondary" href="index.html">취소</a>
                    <button id="submit" type="submit" class="member-primary">로그인</button>
                </div>
            </form>
        </section>
    </main>
    <div id="site-footer"></div>
</body>
</html>
