<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 | EnjoyTrip</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
<script src="js/common/theme-init.js"></script>
<script src="js/config.js"></script>
<script type="module" src="js/pages/signup.js"></script>
</head>
<body data-page="signup">
    <div id="site-header"></div>
    <main id="main">
        <section class="auth-card member-modal">
            <header class="member-modal-header">
                <div>
                    <p class="eyebrow">MEMBER</p>
                    <h2>회원가입</h2>
                </div>
            </header>
            <form id="signup-form" class="member-form">
                <p class="member-form-description">여행 정보를 저장할 회원 정보를 입력해 주세요.</p>
                <div class="member-field">
                    <label for="name">이름</label>
                    <input type="text" id="name" maxlength="50" autocomplete="name" required />
                </div>
                <div class="member-field">
                    <label for="email">이메일</label>
                    <input type="email" id="email" maxlength="100" autocomplete="email" required />
                    <div class="field-feedback valid">사용할 수 있는 email입니다.</div>
                    <div class="field-feedback invalid">이미 사용중인 email입니다.</div>
                </div>
                <div class="member-field">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" minlength="8" maxlength="64" autocomplete="new-password" required />
                    <small>8자 이상 입력해 주세요.</small>
                </div>
                <p id="form-message" class="alert-msg" role="alert"></p>
                <div class="member-actions">
                    <a class="btn-link member-secondary" href="index.html">취소</a>
                    <button id="submit" type="submit" class="member-primary">등록</button>
                </div>
            </form>
        </section>
    </main>
    <div id="site-footer"></div>
</body>
</html>
