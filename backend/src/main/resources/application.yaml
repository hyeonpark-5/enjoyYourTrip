# 모든 환경 공통 설정. 환경별 값(DB, Redis 접속 정보 등)은 application-{profile}.yaml에 둔다.
spring:
  application:
    name: enjoyyourtrip
  profiles:
    # 실행 시 프로필을 지정하지 않으면 local로 동작한다. (배포 시 SPRING_PROFILES_ACTIVE로 덮어씀)
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway(db/migration)가 관리하고, JPA는 엔티티와 일치하는지 검증만 한다.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: redis
    redis:
      time-to-live: 1h
      key-prefix: "cache:"
  http:
    serviceclient:
      tour:
        base-url: https://apis.data.go.kr/B551011/KorService2
        connect-timeout: 5s
        read-timeout: 10s

server:
  port: 8080

app:
  jwt:
    issuer: enjoyyourtrip
    secret: ${JWT_SECRET:}          # .env에 32바이트 이상으로 설정
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    refresh-cookie:
      path: /api/v1/auth
      same-site: Lax
      secure: false                 # HTTPS 배포 환경에서는 true
  tour-api:
    service-key: ${TOUR_API_KEY:}   # 공공데이터포털 디코딩 키
    mobile-app: EnjoyYourTrip
  admin:
    # 비어 있지 않으면 서버 시작 시 관리자 계정이 없을 때 하나 만든다.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: 관리자
