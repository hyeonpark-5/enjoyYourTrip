# 모든 환경 공통 설정. 환경별 값(DB, Redis 접속 정보 등)은 application-{profile}.yaml에 둔다.
spring:
  application:
    name: enjoyyourtrip
  profiles:
    # 실행 시 프로필을 지정하지 않으면 local로 동작한다.
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway(db/migration)가 관리하고, JPA는 엔티티와 일치하는지 검증만 한다.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 8MB        # 핫플레이스 사진 원본 최대 크기
      max-request-size: 9MB
  cache:
    type: redis
    redis:
      time-to-live: 1h
      key-prefix: "cache:"
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm이 발급한 Access Token만 받는다. 서명 키는 첫 요청 때 jwk-set-uri에서 받아온다.
          issuer-uri: ${KEYCLOAK_URL}/realms/enjoyyourtrip
          jwk-set-uri: ${KEYCLOAK_URL}/realms/enjoyyourtrip/protocol/openid-connect/certs
          audiences:
            - enjoyyourtrip-api
  http:
    serviceclient:
      tour:
        base-url: ${TOUR_API_BASE_URL}   # .env에 설정
        connect-timeout: 5s
        read-timeout: 10s
      keycloak-token:
        base-url: ${KEYCLOAK_URL}
        connect-timeout: 3s
        read-timeout: 5s
      keycloak-admin:
        base-url: ${KEYCLOAK_URL}
        connect-timeout: 3s
        read-timeout: 5s

server:
  port: 8080

app:
  keycloak:
    realm: enjoyyourtrip
    client-id: enjoyyourtrip-backend
    client-secret: ${KEYCLOAK_BACKEND_CLIENT_SECRET}
  storage:
    hotplace-image-dir: ${user.home}/enjoyyourtrip-data/hotplace-images
  tour-api:
    service-key: ${TOUR_API_KEY:}   # 공공데이터포털 디코딩 키
    mobile-app: EnjoyYourTrip
  admin:
    # 비어 있지 않으면 서버가 뜬 뒤 Keycloak에 관리자 계정이 없을 때 하나 만든다.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: 관리자
